# nginx reverse proxy for Snapcast Studio.
# Install:  cp deploy/nginx-snapcast.conf /etc/nginx/sites-available/snapcast
#           ln -sf /etc/nginx/sites-available/snapcast /etc/nginx/sites-enabled/
#           rm -f /etc/nginx/sites-enabled/default
#           nginx -t && systemctl reload nginx
#
# Then run certbot to add HTTPS (it rewrites this file automatically):
#           certbot --nginx -d your-domain.com

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain once you have one. Until then, the server's
    # IP works via the default_server fallback below.
    server_name _;

    # Event photos and video are large; the app's own cap is 150MB per file.
    client_max_body_size 200M;

    # ffmpeg jobs (clips, montages) can run well over a minute — the default
    # 60s proxy timeout would kill them mid-encode and surface as a 504.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Uploaded photos, generated clips, and montages.
    #
    # These MUST be served by nginx, not proxied to Next. `next start` serves
    # public/ from a manifest built at build time, so anything written there
    # afterwards — i.e. every upload — 404s. Serving from disk also keeps
    # large video files off the Node event loop entirely.
    location /uploads/ {
        alias /srv/snapcast/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Filenames carry a UUID, so a missing file is a real 404, not a
        # stale-cache artifact — don't let nginx hunt for index files.
        autoindex off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The app's rate limiter reads this to identify clients — without it
        # every request looks like it came from 127.0.0.1 and shares one bucket.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
